name: Validate curated bibliography

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/build.py'
      - 'scripts/validate.py'
      - 'README.md'
      - 'README_zh.md'
      - 'data/navigation.json'
      - 'scripts/build_site.py'
      - 'tests/**'
      - 'docs/site.template.html'
      - 'docs/landscape.template.html'
      - 'index.html'
      - 'landscape.html'
      - 'docs/index.html'
      - 'docs/landscape.html'
      - 'docs/weight-centric-research*.md'
      - 'docs/wsp-evidence.md'
      - '.github/workflows/validate-bibliography.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/build.py'
      - 'scripts/validate.py'
      - 'README.md'
      - 'README_zh.md'
      - 'data/navigation.json'
      - 'scripts/build_site.py'
      - 'tests/**'
      - 'docs/site.template.html'
      - 'docs/landscape.template.html'
      - 'index.html'
      - 'landscape.html'
      - 'docs/index.html'
      - 'docs/landscape.html'
      - 'docs/weight-centric-research*.md'
      - 'docs/wsp-evidence.md'
      - '.github/workflows/validate-bibliography.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate data and bilingual entries
        run: python3 scripts/validate.py
      - name: Check generated Markdown and latest-three updates
        run: python3 scripts/build.py --check
      - name: Validate generated research catalog and map
        run: python3 scripts/build_site.py --check
      - name: Run navigation/data tests
        run: python3 -m unittest discover -s tests -v
      - name: Syntax-check generated browser scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for source, output in (("index.html", "_catalog.js"), ("landscape.html", "_landscape.js")):
              content = Path(source).read_text(encoding="utf-8")
              script = content.split("<script>", 1)[1].split("</script>", 1)[0]
              Path(output).write_text(script, encoding="utf-8")
          PY
          node --check _catalog.js
          node --check _landscape.js
      - name: Test browser navigation and filters (no dependencies)
        run: node tests/test_site_ui.cjs
