name: Validate curated bibliography

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/build.py'
      - 'scripts/validate.py'
      - 'README.md'
      - 'README_zh.md'
      - 'data/navigation.json'
      - 'scripts/build_site.py'
      - 'docs/site.template.html'
      - 'docs/landscape.template.html'
      - 'index.html'
      - 'landscape.html'
      - 'docs/index.html'
      - 'docs/landscape.html'
      - 'docs/weight-centric-research*.md'
      - 'docs/wsp-evidence.md'
      - '.github/workflows/validate-bibliography.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/build.py'
      - 'scripts/validate.py'
      - 'README.md'
      - 'README_zh.md'
      - 'data/navigation.json'
      - 'scripts/build_site.py'
      - 'docs/site.template.html'
      - 'docs/landscape.template.html'
      - 'index.html'
      - 'landscape.html'
      - 'docs/index.html'
      - 'docs/landscape.html'
      - 'docs/weight-centric-research*.md'
      - 'docs/wsp-evidence.md'
      - '.github/workflows/validate-bibliography.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate data and bilingual entries
        run: python3 scripts/validate.py
      - name: Check generated Markdown and latest-three updates
        run: python3 scripts/build.py --check
      - name: Validate generated research catalog and map
        run: python3 scripts/build_site.py --check
      - name: Run navigation/data tests
        run: python3 -m unittest discover -s tests -v
