name: Validate curated bibliography

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/build.py'
      - 'scripts/validate.py'
      - 'README.md'
      - 'README_zh.md'
      - 'docs/weight-centric-research*.md'
      - 'docs/wsp-evidence.md'
      - '.github/workflows/validate-bibliography.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/build.py'
      - 'scripts/validate.py'
      - 'README.md'
      - 'README_zh.md'
      - 'docs/weight-centric-research*.md'
      - 'docs/wsp-evidence.md'
      - '.github/workflows/validate-bibliography.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate data and bilingual entries
        run: python3 scripts/validate.py
      - name: Check generated Markdown and latest-three updates
        run: python3 scripts/build.py --check
